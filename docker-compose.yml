# Local test stack for atomic-spark: Postgres-backed Polaris + PySpark/Iceberg.
# Storage is a shared volume (Polaris FILE storage) mounted at /warehouse in both
# Polaris and Spark; nothing in the transaction semantics depends on S3.
#
#   docker compose up -d --wait polaris-setup
#   docker compose run --rm spark python spike/m0.py
#   docker compose down -v

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: POLARIS
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: "pg_isready -U postgres"
      interval: 2s
      timeout: 2s
      retries: 30

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.8.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/POLARIS
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
    command: ["bootstrap", "--realm=POLARIS", "--credential=POLARIS,root,s3cr3t"]

  warehouse-init:
    image: alpine:3.22
    volumes:
      - warehouse:/warehouse
    command: ["sh", "-c", "chmod 0777 /warehouse"]

  polaris:
    image: apache/polaris:1.8.0
    user: root # shares /warehouse with the Spark container, which also runs as root
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
      warehouse-init:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
      - "8182:8182"
    volumes:
      - warehouse:/warehouse
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/POLARIS
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      QUARKUS_OTEL_SDK_DISABLED: "true"
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": "[\"FILE\",\"S3\"]"
      polaris.readiness.ignore-severe-issues: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 10s

  polaris-setup:
    image: alpine/curl:8.22.0
    depends_on:
      polaris:
        condition: service_healthy
    volumes:
      - ./docker/polaris/setup.sh:/setup.sh:ro
    entrypoint: ["/bin/sh", "/setup.sh"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/polaris-setup-done"]
      interval: 1s
      timeout: 5s
      retries: 120

  spark:
    build: ./docker/spark
    depends_on:
      polaris-setup:
        condition: service_healthy
    volumes:
      - warehouse:/warehouse
      - .:/work
    working_dir: /work
    environment:
      POLARIS_URI: http://polaris:8181/api/catalog
      POLARIS_CREDENTIAL: root:s3cr3t
      POLARIS_WAREHOUSE: atomic
      PYTHONPATH: /work
    profiles: ["tools"]

volumes:
  warehouse:
